[package]
name = "survivors-like"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d"] }
bytemuck = "1.25.2"
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
tokio = { version = "1.54.1", features = ["sync"] }
wasm-bindgen = "0.2.129"
wgpu = "30.0.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rand = { version = "0.10.3", default-features = false, features = [ "std_rng", "thread_rng" ] }
